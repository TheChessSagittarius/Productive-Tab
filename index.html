<!DOCTYPE html>
<html lang="en">
<head>
    meta charset="UTF-8">
    meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="dashboard container">
        <section class="clock-section">
            <h1 id="clock">00:00:00</h1>
            <p id="date">Loading date...</p>
        </section>
        
        <section class = "links-grid">
            <a href = "https://github.com" class="link-card" target="_blank">GitHub</a>
            <a href = "https://chess.com" class="link-card" target="_blank">Chess.com</a>
            <a href = "https://leetcode.com" class="link-card" target="_blank">LeetCode</a>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
